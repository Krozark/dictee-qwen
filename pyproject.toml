[project]
name = "dictee-qwen"
version = "0.1.0"
description = "Dictée vocale locale (français) pour Linux Mint, avec Qwen3-ASR et injection système."
requires-python = ">=3.9"
dependencies = [
    # Pinned below 2.0: the system-site-packages scipy (pulled in by
    # --system-site-packages for PyGObject) is built against the NumPy 1.x
    # API (e.g. the removed `numpy.Inf` alias) and breaks on NumPy 2.x.
    "numpy<2",
    "sounddevice",
    "requests",
    "python-xlib",
    "transformers>=4.46",
    "accelerate",
    "torch",
    "torchaudio",
    "tomli; python_version < '3.11'",
]
# PyGObject (the `gi` module, used for the GTK overlay) is intentionally not
# listed here: building it from source requires girepository dev headers
# that need root to install. Use the system-packaged python3-gi instead
# (installed by setup.sh via apt) and create the venv with
# `uv venv --system-site-packages`, as this project's setup.sh does.

[dependency-groups]
dev = [
    "pytest",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cu126" }]
torchaudio = [{ index = "pytorch-cu126" }]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true
